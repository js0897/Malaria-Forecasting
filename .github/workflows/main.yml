name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App URL
        run: |
          curl -sSf -I https://malaria-forecasting-pqxshv7rb8z5jwqjrpzklq.streamlit.app/ || echo "Ping failed, app may be asleep or URL is wrong"
